defaults:
  - override hydra/job_logging: disabled
  - _self_

seed: 42

data:
  directory: datasets/pipe_flow
  max_trajectories: null

search:
  width: [64, 128]
  depth: [2, 3]
  latent_width: [16, 32]
  activation: [silu, gelu, tanh]
  learning_rate: [1.0e-4, 3.0e-3]
  weight_decay: [1.0e-8, 1.0e-4]
  batch_size: [64, 128]

tune:
  num_samples: 8
  max_epochs: 20
  grace_period: 5
  reduction_factor: 2

physics:
  num_samples: 5
  min_weight: 1.0e-4
  max_weight: 1.0

final:
  epochs: 40
  evaluation_batch_size: 128
  plot_cases: 3

ray:
  cpus_per_trial: 2
  gpus_per_trial: 1
  max_concurrent_trials: 1
  verbose: 1
  # Keep this short: Ray's generated AF_UNIX socket path is limited to 107 bytes.
  temp_directory: .ray

output:
  directory: scripts/pipe_flow/results/physics_deeponet

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
