[project]
name = "experiment-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cantera>=3.2.0",
    "deepxde>=1.15.0",
    "graphviz>=0.21",
    "h5py>=3.16.0",
    "hydra-core>=1.3.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "neuraloperator>=2.0.0",
    "numpy>=2.5.0",
    "nvidia-physicsnemo>=2.1.1",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "ray[tune]>=2.56.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
]

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
sundials = [
    "scikits-odes>=3.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chem_operator.example_data" = ["*.yaml", "README.md"]

[tool.uv]
config-settings-package = { scikits-odes-daepack = { setup-args = "-Dc_std=c17" } }

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:(?s)NasaPoly2.*discontinuity in h/RT detected:UserWarning",
]
