version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # Keep security updates enabled without routine version-update PRs.
    open-pull-requests-limit: 0
    exclude-paths:
      - "results/**"
      - "archive/**"
      - "archives/**"
      - "**/vendor/**"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
